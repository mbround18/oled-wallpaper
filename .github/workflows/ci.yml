name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    name: paws ci --toolchain rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mbround18/paws/actions/paws-up@main
      - run: paws ci --toolchain rust
