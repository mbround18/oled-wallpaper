name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cargo.toml / metainfo.xml / tag are in sync
        run: |
          chmod +x scripts/version-sync
          ./scripts/version-sync --tag "${{ github.ref_name }}"

  test:
    name: Test Suite
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --verbose

  build:
    name: Build release binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --verbose
      - name: Package tarball
        run: |
          STAGE="oled-wallpaper-${{ github.ref_name }}-x86_64-linux"
          mkdir -p "$STAGE"
          cp target/release/oled-wallpaper target/release/oled-config "$STAGE/"
          cp -r packaging "$STAGE/"
          cp README.md "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-tarball
          path: "oled-wallpaper-*.tar.gz"

  build-flatpak:
    name: Build Flatpak bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build bundle
        run: make build-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: "dist/*.flatpak"

  release:
    name: Publish GitHub Release
    needs: [build, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.flatpak
          generate_release_notes: true
