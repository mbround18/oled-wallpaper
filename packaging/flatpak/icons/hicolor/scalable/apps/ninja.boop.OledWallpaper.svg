<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLED Wallpaper Icon">
  <!-- Background transparent to blend with desktops -->
  <defs>
    <radialGradient id="g1" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#FFD76B" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FF9B3E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D85DFF" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8DE7FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3A9BFF" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD76B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF7AB6" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
  </defs>

  <!-- soft starfield -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="28" cy="36" r="1.4" />
    <circle cx="56" cy="18" r="1" />
    <circle cx="210" cy="48" r="1" />
    <circle cx="190" cy="210" r="1.2" />
    <circle cx="140" cy="34" r="0.9" />
    <circle cx="90" cy="70" r="0.8" />
    <circle cx="60" cy="190" r="0.9" />
    <circle cx="200" cy="120" r="0.7" />
  </g>

  <!-- small spiral galaxy (subtle) -->
  <g transform="translate(180,46) scale(0.9)" fill="none" stroke="#DDA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M0 0 C 6 -6, 14 -8, 22 -6 C 30 -4, 36 2, 34 10 C 32 18, 24 22, 16 20" opacity="0.6"/>
    <path d="M0 0 C -6 6, -14 8, -22 6 C -30 4, -36 -2, -34 -10 C -32 -18, -24 -22, -16 -20" opacity="0.5"/>
    <circle cx="2" cy="-1" r="2.6" fill="#FFF8F0" opacity="0.95" />
  </g>

  <!-- Big planet with ring (foreground) -->
  <g transform="translate(78,160)">
    <circle cx="0" cy="0" r="52" fill="url(#g1)" filter="url(#soft)" />
    <!-- ring -->
    <ellipse rx="76" ry="22" cx="0" cy="12" fill="none" stroke="url(#ring)" stroke-width="8" transform="rotate(-18)" opacity="0.95"/>
    <circle cx="-8" cy="6" r="10" fill="#FFF" opacity="0.08" />
  </g>

  <!-- smaller bluish planet (midground) -->
  <g transform="translate(162,118)">
    <circle cx="0" cy="0" r="30" fill="url(#g2)" />
    <circle cx="-6" cy="-6" r="6" fill="#6EE5FF" opacity="0.18" />
  </g>

  <!-- tiny moon orbiting big planet -->
  <g transform="translate(132,130)">
    <circle cx="48" cy="-10" r="6" fill="#EAEAEA" opacity="0.95" />
  </g>

  <!-- subtle glow behind composition -->
  <circle cx="110" cy="100" r="90" fill="#000000" opacity="0.18" />

  <!-- signature dot to match brand feel -->
  <circle cx="46" cy="220" r="3.8" fill="#FFB56B" />

</svg>
