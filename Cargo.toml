[package]
name = "oled-wallpaper"
version = "0.1.0"
edition = "2021"

[lib]
name = "oled_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "oled-wallpaper"
path = "src/main.rs"

[[bin]]
name = "oled-config"
path = "src/bin/oled-config.rs"

[dependencies]
wgpu = "0.20"
winit = "0.29"
glam = "0.24"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
bytemuck = { version = "1.0", features = ["derive"] }
pollster = "0.3"
clap = { version = "4.0", features = ["derive"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", optional = true }
glyphon = "0.5"
chrono = { version = "0.4", default-features = true }
anyhow = "1.0"
dirs = "4.0"
eframe = "0.22"
egui = "0.22"
sysinfo = "0.29"
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[features]
default = ["x11"]
x11 = ["dep:x11rb"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
assert_cmd = "2.0"
tempfile = "3.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
