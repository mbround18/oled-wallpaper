[package]
name = "oled-wallpaper"
version = "0.1.0"
edition = "2021"

[lib]
name = "oled_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "oled-wallpaper"
path = "src/main.rs"

[dependencies]
wgpu = "0.19"
winit = "0.29"
glam = "0.24"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
